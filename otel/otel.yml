extensions:
  # 入站 OTLP receiver 的 Bearer Token 校验（对应 Alloy: otelcol.auth.bearer + receiver.otlp.auth）
  bearertokenauth/ingest:
    scheme: "Bearer"
    token: ${env:OTELCOL_AUTH_BEARER_CREDS_TOKEN}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth/ingest
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth/ingest

processors:
  transform/nologfmt:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
           - replace_pattern(body, "=", " = ") where IsString(body)
  batch:
    send_batch_size: 1000
    send_batch_max_size: 2000
    timeout: 2s

exporters:
  # traces -> Tempo（OTLP/gRPC）
  otlp/tempo:
    endpoint: "http://tempo:4317"
    tls:
      insecure: true
      insecure_skip_verify: true

  # logs -> Loki
  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"

  # metrics -> Mimir（Prometheus remote_write）
  prometheusremotewrite/mimir:
    endpoint: http://mimir:9009/api/v1/push

service:
  extensions:
    - bearertokenauth/ingest

  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheusremotewrite/mimir]

    logs:
      receivers: [otlp]
      processors: [transform/nologfmt,batch]
      exporters: [otlphttp/loki]
