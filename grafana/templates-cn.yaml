apiVersion: 1
templates:
  - name: templates-cn
    type: gotemplate
    content: |
      {{ define "__alertmanager" }}Alertmanager{{ end }}

      {{ define "__alertmanagerURL" }}{{.ExternalURL}}/#/alerts?receiver={{.Receiver | urlquery}}{{ end }}

      {{ define "__description" }}{{ end }}

      {{/* 标题：中文状态 + 仅显示 GroupLabels */}}
      {{ define "__subject" }}[{{ if eq .Status "firing" }}告警中{{ else }}已恢复{{ end }}] {{ .GroupLabels.SortedPairs.Values | join " " }}{{ end }}

      {{/* 数值列表 */}}
      {{ define "__text_values_list" }}{{if len .Values}}{{$first := true}}{{range $refID, $value := .Values}}{{if $first}}{{$first = false}}{{else}}，{{end}}{{$refID}}={{$value}}{{end}}{{else}}【无数值】{{end}}{{ end }}

      {{ define "__text_alert_list" }}{{ range . }}
      数值：{{template "__text_values_list" .}}
      标签：
      {{ range .Labels.SortedPairs}} - {{.Name}} = {{.Value}}
      {{ end}}注解：
      {{ range .Annotations.SortedPairs}}- {{ if eq .Name "description" }}描述{{ else if eq .Name "summary" }}摘要{{ else }}{{.Name}}{{ end }} = {{.Value}}
      {{ end}}{{ if gt (len .GeneratorURL) 0}}来源：{{.GeneratorURL}}
      {{ end}}{{ if gt (len .SilenceURL) 0}}静默：{{.SilenceURL}}
      {{ end}}{{ if gt (len .DashboardURL) 0}}仪表盘：{{.DashboardURL}}
      {{ end}}{{ if gt (len .PanelURL) 0}}面板：{{.PanelURL}}
      {{ end}}{{ end }}{{ end }}

      {{/* Markdown 列表 */}}
      {{ define "__text_alert_list_markdown" }}{{ range .}}
      标签：
      {{ range .Labels.SortedPairs}}- {{.Name}} = {{.Value}}
      {{ end}}
      注解：
      {{ range .Annotations.SortedPairs}}- {{ if eq .Name "description" }}描述{{ else if eq .Name "summary" }}摘要{{ else }}{{.Name}}{{ end }} = {{.Value}}
      {{ end}}
      来源：{{.GeneratorURL}}
      {{ end }}{{ end }}

      {{ define "default.title" }}{{template "__subject" .}}{{ end }}

      {{ define "default.message" }}{{- if gt (len .Alerts.Firing) 0 -}}
      {{template "__text_alert_list" .Alerts.Firing}}{{- end -}}{{- if gt (len .Alerts.Resolved) 0 -}}
      {{template "__text_alert_list" .Alerts.Resolved}}{{- end -}}{{ end }}

      {{ define "discord.default.title" }}{{template "__subject" .}}{{ end }}

      {{ define "discord.default.message" }}{{- if gt (len .Alerts.Firing) 0 -}}
      告警中：
      {{template "__text_alert_list" .Alerts.Firing}}{{- end -}}{{- if gt (len .Alerts.Resolved) 0 -}}
      已恢复：
      {{template "__text_alert_list" .Alerts.Resolved}}{{- end -}}
      {{ end }}

      {{ define "jira.default.summary" }}{{template "__subject" .}}{{ end }}

      {{ define "jira.default.description" }}{{- if gt (len .Alerts.Firing) 0 -}}# 告警中：
      {{template "__text_alert_list_markdown" .Alerts.Firing}}{{- end -}}{{- if gt (len .Alerts.Resolved) 0 -}}
      # 已恢复：
      {{template "__text_alert_list_markdown" .Alerts.Resolved}}{{- end -}}{{ end }}

      {{ define "jira.default.priority" }}{{$priority := ""}}{{range .Alerts.Firing}}{{$severity := index .Labels "severity"}}{{if (eq $severity "critical")}}{{$priority = "High"}}{{else}}{{if (and (eq $severity "warning") (ne $priority "High"))}}{{$priority = "Medium"}}{{else}}{{if (and (eq $severity "info") (eq $priority ""))}}{{$priority = "Low"}}{{end}}{{end}}{{end}}{{end}}{{if eq $priority ""}}{{range .Alerts.Resolved}}{{$severity := index .Labels "severity"}}{{if (eq $severity "critical")}}{{$priority = "High"}}{{else}}{{if (and (eq $severity "warning") (ne $priority "High"))}}{{$priority = "Medium"}}{{else}}{{if (and (eq $severity "info") (eq $priority ""))}}{{$priority = "Low"}}{{end}}{{end}}{{end}}{{end}}{{end}}{{$priority}}{{ end }}

      {{ define "msteams.default.title" }}{{template "__subject" .}}{{ end }}

      {{ define "msteams.default.summary" }}{{template "__subject" .}}{{ end }}

      {{ define "msteams.default.text" }}{{- if gt (len .Alerts.Firing) 0 -}}
      # 告警中：
      {{template "__text_alert_list_markdown" .Alerts.Firing}}{{- end -}}{{- if gt (len .Alerts.Resolved) 0 -}}
      # 已恢复：
      {{template "__text_alert_list_markdown" .Alerts.Resolved}}{{- end -}}
      {{ end }}

      {{ define "msteamsv2.default.title" }}{{template "__subject" .}}{{ end }}

      {{ define "msteamsv2.default.text" }}{{- if gt (len .Alerts.Firing) 0 -}}
      # 告警中：
      {{template "__text_alert_list_markdown" .Alerts.Firing}}{{- end -}}{{- if gt (len .Alerts.Resolved) 0 -}}
      # 已恢复：
      {{template "__text_alert_list_markdown" .Alerts.Resolved}}{{- end -}}
      {{ end }}

      {{ define "opsgenie.default.message" }}{{template "__subject" .}}{{ end }}

      {{ define "opsgenie.default.source" }}{{template "__alertmanagerURL" .}}{{ end }}

      {{ define "opsgenie.default.description" }}{{- if gt (len .Alerts.Firing) 0 -}}告警中：
      {{template "__text_alert_list" .Alerts.Firing}}{{- end -}}{{- if gt (len .Alerts.Resolved) 0 -}}
      已恢复：
      {{template "__text_alert_list" .Alerts.Resolved}}{{- end -}}{{ end }}

      {{ define "pagerduty.default.client" }}{{template "__alertmanager" .}}{{ end }}

      {{ define "pagerduty.default.clientURL" }}{{template "__alertmanagerURL" .}}{{ end }}

      {{ define "pagerduty.default.description" }}{{template "__subject" .}}{{ end }}

      {{ define "pagerduty.default.instances" }}{{template "__text_alert_list" .}}{{ end }}

      {{ define "pushover.default.title" }}{{template "__subject" .}}{{ end }}

      {{ define "pushover.default.url" }}{{template "__alertmanagerURL" .}}{{ end }}

      {{ define "pushover.default.message" }}{{- if gt (len .Alerts.Firing) 0 -}}
      告警中：
      {{template "__text_alert_list" .Alerts.Firing}}{{- end -}}{{- if gt (len .Alerts.Resolved) 0 -}}
      已恢复：
      {{template "__text_alert_list" .Alerts.Resolved}}{{- end -}}
      {{ end }}

      {{ define "telegram.default.message" }}{{- if gt (len .Alerts.Firing) 0 -}}
      告警中：
      {{template "__text_alert_list" .Alerts.Firing}}{{- end -}}{{- if gt (len .Alerts.Resolved) 0 -}}
      已恢复：
      {{template "__text_alert_list" .Alerts.Resolved}}{{- end -}}
      {{ end }}

      {{ define "victorops.default.entity_display_name" }}{{template "__subject" .}}{{ end }}

      {{ define "victorops.default.monitoring_tool" }}{{template "__alertmanager" .}}{{ end }}

      {{ define "victorops.default.state_message" }}{{- if gt (len .Alerts.Firing) 0 -}}告警中：
      {{template "__text_alert_list" .Alerts.Firing}}{{- end -}}{{- if gt (len .Alerts.Resolved) 0 -}}
      已恢复：
      {{template "__text_alert_list" .Alerts.Resolved}}{{- end -}}{{ end }}

      {{ define "webex.default.message" }}{{- if gt (len .Alerts.Firing) 0 -}}
      告警中：
      {{template "__text_alert_list" .Alerts.Firing}}{{- end -}}{{- if gt (len .Alerts.Resolved) 0 -}}
      已恢复：
      {{template "__text_alert_list" .Alerts.Resolved}}{{- end -}}
      {{ end }}

      {{ define "webhook.default.payload" }}{{coll.Dict "receiver" .Receiver "status" .Status "alerts" .Alerts "groupLabels" .GroupLabels "commonLabels" .CommonLabels "commonAnnotations" .CommonAnnotations "externalURL" .ExternalURL "version" "1" "orgId" (index .Alerts 0).OrgID "truncatedAlerts" .TruncatedAlerts "groupKey" .GroupKey "state" (tmpl.Inline "{{ if eq .Status \"resolved\" }}ok{{ else }}alerting{{ end }}" .) "title" (tmpl.Exec "default.title" .) "message" (tmpl.Exec "default.message" .) | data.ToJSONPretty " "}}{{ end }}

      {{ define "wechat.default.agent_id" }}{{ end }}
      {{ define "wechat.default.to_party" }}{{ end }}
      {{ define "wechat.default.to_tag" }}{{ end }}
      {{ define "wechat.default.to_user" }}{{ end }}

      {{ define "wechat.default.message" -}}
      {{ if gt (len .CommonAnnotations) 0 }}
      {{ .CommonAnnotations.SortedPairs.Values | join "\n" }}
      {{ end -}}
      {{if gt (len .Alerts.Firing) 0}}
      {{template "__text_alert_list" .Alerts.Firing}}{{ end }}
      {{if gt (len .Alerts.Resolved) 0}}
      {{template "__text_alert_list" .Alerts.Resolved}}{{ end }}
      Alertmanager 地址：{{ template "__alertmanagerURL" . -}}{{ end }}